# Each integration is registered separately so a bump lands as a PR scoped to it. The
# GitHub Actions entry matters most: the release workflows hold publish rights.
version: 2

updates:
  - package-ecosystem: npm
    directory: /n8n
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    groups:
      dev-minor-and-patch:
        update-types: [minor, patch]
    labels: [dependencies, n8n]

  - package-ecosystem: npm
    directory: /zapier
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    labels: [dependencies, zapier]

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    labels: [dependencies, ci]
